<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Tabo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --gold:#D4AF37;
    --accent:#0E7A55;
    --bg:#FAF9F6;
    --surface:#FFFFFF;
    --ink:#1A1712;
    --muted:#6B6459;
    --border:rgba(26,23,18,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --accent:#38B884;
      --bg:#14120F;
      --surface:#1E1B17;
      --ink:#F2EEE4;
      --muted:#A69C8C;
      --border:rgba(255,255,255,.12);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;}
  h1,h2{font-family:'Manrope',sans-serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header.top{
    background:#0B0A08;border-bottom:2px solid var(--gold);
    padding:16px;display:flex;align-items:center;gap:10px;
  }
  .logo-dot{width:30px;height:30px;border-radius:8px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#0B0A08;font-family:'Manrope',sans-serif;}
  header.top .word{color:#fff;font-weight:800;font-size:17px;letter-spacing:.02em;}
  header.top .sub{color:var(--gold);font-size:13px;margin-left:2px;}

  main{max-width:900px;margin:0 auto;padding:20px 16px 40px;}
  .intro h1{font-size:22px;margin-bottom:6px;}
  .intro p{color:var(--muted);font-size:14px;margin:0 0 22px;}

  #status{color:var(--muted);font-size:14px;padding:20px 0;}

  .product-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:18px;}
  .product-photo{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--border);}
  .product-body{padding:16px;}
  .product-name{font-family:'Manrope',sans-serif;font-weight:800;font-size:18px;}
  .product-price{color:var(--accent);font-weight:700;font-size:16px;margin-top:2px;font-family:'IBM Plex Mono',monospace;}
  .product-photo,.colorItem img{cursor:zoom-in;}
  #lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px;}
  #lightbox.open{display:flex;}
  #lightbox img{width:auto;height:auto;max-width:calc(100vw - 32px);max-height:80vh;object-fit:contain;border-radius:10px;cursor:zoom-out;}
  #lightbox .lb-cap{color:#F2EEE4;font-size:14px;font-weight:600;}
  #lightbox .lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.5);color:#fff;font-size:22px;line-height:1;cursor:pointer;}
  .price-note{font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:13px;color:var(--muted);margin-left:4px;}
  .product-combo{font-size:13.5px;color:var(--ink);margin-top:4px;}
  .product-combo b{color:var(--accent);font-family:'IBM Plex Mono',monospace;}
  .colorLabel{font-size:12px;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .colorGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;}
  .colorItem{border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;font-size:11px;}
  .colorItem img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;margin-bottom:6px;cursor:pointer;background:var(--border);}
  .colorItem.outofstock{opacity:.5;}
  .cname{font-weight:600;}
  .cstock{color:var(--accent);}
  .outofstock .cstock{color:var(--muted);}

  footer{max-width:900px;margin:0 auto;padding:0 16px 30px;}
  .wa-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:#25D366;color:#06210F;font-weight:700;text-decoration:none;
    padding:14px;border-radius:12px;font-size:15px;
  }
</style>
</head>
<body>

<header class="top">
  <div class="logo-dot">T</div>
  <span class="word">TABO</span>
  <span class="sub">Catálogo</span>
</header>

<main>
  <div class="intro">
    <h1>Estos son nuestros productos disponibles</h1>
    <p>Toca una foto para verla más grande. El stock se actualiza en vivo.</p>
  </div>
  <div id="status">Cargando catálogo...</div>
  <div id="catalog"></div>
</main>

<div id="lightbox" role="dialog" aria-label="Foto ampliada">
  <button class="lb-close" type="button" aria-label="Cerrar">×</button>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>

<footer>
  <a class="wa-btn" href="https://wa.me/593979805503?text=Hola!%20Vi%20el%20cat%C3%A1logo%20de%20Tabo%20Store%20y%20me%20interesa%20hacer%20un%20pedido." target="_blank" rel="noopener">
    💬 Escribir por WhatsApp
  </a>
</footer>

<script>
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRObh23AELq2-BNj7mOJQc_5FzQWTuVtHSuod2R0KP_egjU0CSTdY0G_6DgUH0xoCYI6orcAOMJo9iI/pub?gid=0&single=true&output=csv";

var PRECIO_COMBO = 40;
var MOSTRAR_PRECIO = false;

function parseCSV(text){
  var lines = text.replace(/\r/g,"").split("\n").filter(function(l){ return l.trim().length; });
  var headers = lines[0].split(",").map(function(h){ return h.trim(); });
  return lines.slice(1).map(function(line){
    var cells = line.split(",");
    var row = {};
    headers.forEach(function(h, i){ row[h] = (cells[i]||"").trim(); });
    return row;
  });
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return '$' + Number(n).toFixed(2); }

var CACHE_KEY = 'tabo-catalogo-csv';
var rendered = false;

function mostrar(text){
  var rows = parseCSV(text);
  if(!rows.length || !rows[0].producto) return false;
  render(rows);
  rendered = true;
  return true;
}

function cargar(intento){
  fetch(CSV_URL, {cache:"no-store"})
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function(text){
      if(mostrar(text)){ try { localStorage.setItem(CACHE_KEY, text); } catch(e){} }
    })
    .catch(function(err){
      console.error(err);
      if(intento < 3){ setTimeout(function(){ cargar(intento + 1); }, 2500); return; }
      var st = document.getElementById('status');
      if(!rendered && st){
        st.innerHTML = 'No se pudo cargar el catálogo. <button type="button" onclick="location.reload()" style="margin-left:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;">Reintentar</button>';
      }
    });
}

try {
  var guardado = localStorage.getItem(CACHE_KEY);
  if(guardado) mostrar(guardado);
} catch(e){}
cargar(1);

var lb = document.getElementById('lightbox');
function cerrarFoto(){ lb.classList.remove('open'); document.getElementById('lbImg').removeAttribute('src'); }
document.getElementById('catalog').addEventListener('click', function(e){
  var img = e.target.closest('img');
  if(!img) return;
  var cap = img.closest('.colorItem') ? img.getAttribute('alt') : 'Chaqueta TABO';
  document.getElementById('lbImg').src = img.getAttribute('src');
  document.getElementById('lbCap').textContent = cap || '';
  lb.classList.add('open');
});
lb.addEventListener('click', cerrarFoto);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') cerrarFoto(); });

function render(rows){
  var st = document.getElementById('status');
  if(st) st.remove();

  var byProduct = {};
  rows.forEach(function(r){
    if(!byProduct[r.producto]) byProduct[r.producto] = [];
    byProduct[r.producto].push(r);
  });

  var html = Object.keys(byProduct).map(function(pname){
    var variants = byProduct[pname];
    var price = variants[0].precio;
    var mainImg = variants[0].imagen;

    var colors = variants.map(function(v){
      var stock = parseInt(v.stock, 10) || 0;
      var out = stock === 0;
      return '<div class="colorItem'+(out?' outofstock':'')+'">'
        + '<img src="'+esc(v.imagen)+'" alt="'+esc(v.variante)+'">'
        + '<div class="cname">'+esc(v.variante)+'</div>'
        + '<div class="cstock">'+(out?'Agotado':(stock+' disp.'))+'</div>'
        + '</div>';
    }).join('');

    return '<div class="product-card">'
      + '<img class="product-photo" src="'+esc(mainImg)+'" alt="">'
      + '<div class="product-body">'
      +   '<div class="product-name">'+esc(pname)+'</div>'
      +   (MOSTRAR_PRECIO ? '<div class="product-price">'+money(price)+'<span class="price-note">· envío gratis</span></div>'
          + '<div class="product-combo">Combo 2 por <b>'+money(PRECIO_COMBO)+'</b> · envío gratis</div>' : '')
      +   '<div class="colorLabel">Colores y tallas disponibles</div>'
      +   '<div class="colorGrid">'+colors+'</div>'
      + '</div></div>';
  }).join('');

  document.getElementById('catalog').innerHTML = html;
}
</script>
</body>
</html>
